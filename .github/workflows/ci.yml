name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (keeps PR queues fast).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The coverage floor is pinned to the measured baseline (74%); the build
      # fails if coverage drops below it. Raise the floor as new tests land.
      - run: python -m pytest -q --cov=prism --cov-report=term-missing --cov-report=xml --cov-fail-under=74
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  eval-gate:
    name: eval gate (golden F1)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      # Stub backend replays canned model outputs; the gate fails the build
      # if the pipeline (gate + line validation + matching) drops below F1.
      # For real-model evals, run locally with --backend vllm|api|hf_endpoint.
      # Uses the full golden set when present, else the shipped example set.
      - name: run golden eval
        run: |
          GOLDEN=eval/golden.example.jsonl
          if [ -f eval/golden.jsonl ]; then GOLDEN=eval/golden.jsonl; fi
          echo "golden set: $GOLDEN"
          python -m prism.eval.runner \
            --golden "$GOLDEN" \
            --backend stub \
            --min-f1 0.70
